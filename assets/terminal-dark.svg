<title id="title">Alexandre Andriani — Cibersegurança e Redes</title>
<desc id="desc">Perfil em formato de terminal, com um computador desktop em ASCII. Certificações CCNA, CMNA e FCA. Foco em Network Security, hardening, VPN, firewalls, IDS/IPS, segmentação, monitoramento e threat hunting. Ferramentas: Cisco Umbrella, Microsoft Defender XDR, KQL, Splunk e Wireshark. Estudos em CCNP Security. Idiomas: português, inglês e francês. Interesses: laboratórios de redes, segurança e automação.</desc>
